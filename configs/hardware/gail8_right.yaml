# Right follower arm on gail8. Placeholder — verify camera serials and
# re-preview safe motions before first use (right arm is mirrored).
robot:
  side: right
  follower_can: can_right
  master_can: can_right_mst
  sdk_interface: 2
  sdk_protocol: 2
  firmware_family: S-V1.8-5
  gripper_max_open_m: 0.07

control:
  policy_hz: 10
  servo_hz: 50
  command_timeout_s: 0.25
  max_linear_velocity_mps: 0.03
  max_angular_velocity_radps: 0.20
  max_gripper_velocity_mps: 0.02
  max_joint_delta_rad: 0.02
  gripper_effort_sdk: 1000
  move_speed_rate: 100

cameras:
  static:
    serial: "246322301143"       # D455 (shared static camera, verified 2026-07-22)
  wrist:
    serial: "TO_BE_IDENTIFIED"   # the other D405 of 335122270662 / 353322271383
  width: 320
  height: 180
  capture_width: 640
  capture_height: 360
  fps: 30

kinematics:
  urdf: assets/piper_x/urdf/piper_x_description_dualarm_v2.urdf
  base_frame: right_base_link
  ee_frame: right_gripper_base
